name: Feature request
description: 提出一个功能或改进建议
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先描述**要解决的问题**，而不是直接指定实现方式。设计约束见
        CONTRIBUTING.md（颜色即事实、不猜测、本地优先、写入鉴权）。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在的体验哪里不够好？谁在什么场景下遇到？
      placeholder: 我同时开三个 Claude Code 会话时，分不清是哪一个在等我……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 可以给出多个方案，并说明取舍。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 有没有不新增状态色、不增加常驻开销的做法？

  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      options:
        - label: 这个建议不会让绿色表示「非运行」状态
          required: true
        - label: 这个建议不需要上传会话内容或遥测
          required: true
