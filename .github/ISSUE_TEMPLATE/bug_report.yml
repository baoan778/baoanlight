name: Bug report
description: 报告一个可复现的问题
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先运行 `bao doctor`，并确认问题在最新版本仍然存在。
        **不要粘贴 token、会话正文或未脱敏的日志。**

  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 实际行为是什么？你期望的是什么？
      placeholder: 机器人显示为绿灯，但代理其实在等我确认……
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 尽量给出最小、可重复的步骤。
      placeholder: |
        1. 运行 bao start
        2. 在 Claude Code 里触发一次权限确认
        3. 观察机器人颜色
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: Windows 11 23H2
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: 版本
      description: baoanlight、Node、Electron（如相关）
      placeholder: baoanlight 2.0.0 · node v22.14.0 · electron 38
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: 相关代理
      multiple: true
      options:
        - Claude Code
        - Codex
        - DeepSeek Harness
        - WorkBuddy
        - CodeBuddy
        - 其他 CLI / 包装器
        - 与代理无关

  - type: textarea
    id: doctor
    attributes:
      label: bao doctor 输出
      description: 请粘贴 pass/warn/fail 列表（不要包含 token）。
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已确认这不是 token、路径或会话正文泄露问题
          required: true
        - label: 我已尝试最新版本
          required: true
