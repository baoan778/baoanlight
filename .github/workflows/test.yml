name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The token only needs to read the checkout. Failures are reported through the
# normal check run, so no write permission is required.
permissions:
  contents: read

# A new push supersedes the previous run: cancel it instead of paying for two
# full matrices that can only disagree about an older commit.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The logic tests. These are the ones that catch real bugs. baoanlight is a
  # Windows-only product, so that is the only platform the matrix needs.
  test:
    name: windows / node ${{ matrix.node }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ matrix.node }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-${{ matrix.node }}-npm-

      # Electron and node-pty are both optional at runtime, and both are large or
      # need a toolchain. The suite must pass without either.
      - name: Install without optional binaries
        run: npm install --no-optional --ignore-scripts --no-audit --no-fund

      # 语法层面的失败（引用了没定义的变量、声明了从来不用的东西）不需要跑三套
      # 浏览器的逻辑测试来发现，先在最便宜的一层挡掉。
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # 打包契约：运行文件齐全、测试/密钥不会被打包。只在发布时才查的话，
      # 一个写坏了的 `files` 会一路活到打 tag 的那天 —— 而那时版本号已经用掉。
      - name: Package contents
        run: npm run check:pack

      # A smoke test of the actual CLI, because "the modules are correct" and
      # "the tool works when you run it" are different claims.
      - name: CLI smoke test
        shell: bash
        run: |
          node src/cli.js start --no-overlay --port 4788 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:4788/health >/dev/null && break || sleep 0.5
          done
          curl -sf http://127.0.0.1:4788/health
          BAOANLIGHT_PORT=4788 node src/cli.js set busy --agent ci --session smoke --detail building
          BAOANLIGHT_PORT=4788 node src/cli.js status | tee /tmp/status.txt
          grep -q busy /tmp/status.txt
          BAOANLIGHT_PORT=4788 node src/cli.js set idle --agent ci --session smoke
          BAOANLIGHT_PORT=4788 node src/cli.js status | grep -q idle
          BAOANLIGHT_PORT=4788 node src/cli.js doctor || true
          BAOANLIGHT_PORT=4788 node src/cli.js stop

      # Installing hooks must not corrupt a real settings.json on any platform —
      # path separators and quoting are the usual culprits.
      - name: Hook install/uninstall round trip
        shell: bash
        run: |
          mkdir -p .claude
          echo '{"permissions":{"allow":["Bash(ls:*)"]}}' > .claude/settings.json
          node src/cli.js connect claude --scope project
          node -e "
            const s=require('./.claude/settings.json');
            const n=Object.values(s.hooks).flat().flatMap(g=>g.hooks).length;
            if(n!==8) throw new Error('expected 8 hooks, got '+n);
            if(!s.permissions) throw new Error('existing settings were clobbered');
          "
          node src/cli.js disconnect claude --scope project
          node -e "
            const s=require('./.claude/settings.json');
            if(s.hooks && Object.keys(s.hooks).length) throw new Error('uninstall left hooks behind');
            if(!s.permissions) throw new Error('uninstall damaged unrelated settings');
          "

  # Proves the Electron window actually builds and launches on Windows, which
  # the logic tests deliberately do not cover.
  overlay:
    name: overlay / windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-overlay-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-overlay-npm-
      - run: npm install --no-audit --no-fund
      - name: Fetch the Electron runtime
        run: npm run setup
      - name: Electron binary is usable
        run: node -e "const p=require('electron'); require('fs').accessSync(p); console.log('electron at', p)"

      # 真正启动 Electron 并驱动窗口：preload 桥、SSE 状态、可见性与置顶。
      - name: Electron main-process smoke test
        run: npm run test:electron

  # Renders the real overlay and the landing page in a browser and measures them.
  # The logic suite cannot see a clipped glow, a lamp that drifts, or text that
  # fails contrast — this can.
  ui:
    name: rendered UI / windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-ui-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-ui-npm-
      - uses: actions/cache@v4
        with:
          path: ${{ env.LOCALAPPDATA }}/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-
      - run: npm install --no-optional --no-audit --no-fund
      - run: npm install -D @playwright/test --no-audit --no-fund
      - run: npx playwright install chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: test-results/
          retention-days: 7
