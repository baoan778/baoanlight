name: release

# Releases are distributed as GitHub Release assets (the tarball + its SHA-256),
# not through the npm registry, so no npm account or token is involved.
#
#   npm version patch    # or minor / major — bumps, commits and tags
#   git push --follow-tags
#
# Pushing the tag runs the full gate again and then attaches
# `baoanlight-<version>.tgz` and `baoanlight-<version>.tgz.sha256` to the
# release. If the release already exists, the assets are replaced.

on:
  push:
    tags: ['v*']

permissions:
  contents: write      # to create the GitHub release and upload assets

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install
        run: npm install --no-optional --no-audit --no-fund

      # A tag that disagrees with the manifest ships a version nobody meant to
      # release, under a name nobody can find. Cheap to check, ugly to undo.
      - name: Tag must match package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG  package.json=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag $TAG does not match package.json $PKG"; exit 1; }

      # Never release a build that has not passed. This is the last gate before
      # something irreversible.
      - name: Lint
        run: npm run lint

      - name: Logic tests
        run: npm test

      - name: Install browser for the UI tests
        run: npx playwright install chromium

      - name: Rendered UI tests
        run: npx playwright test

      # A package missing package.json's `files` entry for a runtime file would
      # ship an install that starts and then crashes. This is the cheapest
      # possible check for that class of mistake.
      - name: Package contents
        run: npm run check:pack

      - name: Build release assets
        run: |
          npm pack
          PKG=$(node -p "require('./package.json').version")
          TGZ="baoanlight-$PKG.tgz"
          test -f "$TGZ" || { echo "::error::npm pack did not produce $TGZ"; exit 1; }
          sha256sum "$TGZ" | cut -d' ' -f1 > "$TGZ.sha256"
          echo "--- sha256 ---"
          cat "$TGZ.sha256"
          # Stable asset names, so docs and the in-app hints can point at
          # .../releases/latest/download/baoanlight.tgz without knowing the
          # version. Same bytes as the versioned tarball above.
          cp "$TGZ" baoanlight.tgz
          cp "$TGZ.sha256" baoanlight.tgz.sha256

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          TGZ="baoanlight-$PKG.tgz"
          ASSETS=("$TGZ" "$TGZ.sha256" baoanlight.tgz baoanlight.tgz.sha256)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
