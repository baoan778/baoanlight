name: pages

# The landing page is plain static HTML in docs/. GitHub Pages is the only
# hosting it needs, and the demo files under docs/demo/ are build output
# produced by `npm run build:pages`.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". After that every push to main that touches docs/ deploys.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
