<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
<title>机器人拆解 · baoanlight</title>
<style>
  /* 固定 1600 × 900 的控制台：所有坐标都按这个尺寸算，再整体缩放到窗口。
     这么做的原因是「标签不能遮住零件」「重要内容不离画面边缘 60px」这类规则
     需要确定的画布，而不是随窗口流动的布局。 */
  :root {
    --paper: #f4f1ea;
    --paper-2: #ece7db;
    --ink: #1a1a18;
    --ink-2: #55524a;
    --muted: #8a8578;
    --line: #d6d0c2;
    --accent: #c8452d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--paper-2);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink); overflow: hidden;
  }
  #frame {
    position: absolute; left: 50%; top: 50%;
    width: 1600px; height: 900px; margin: -450px 0 0 -800px;
    background: radial-gradient(120% 90% at 50% 8%, #fbf9f4 0%, var(--paper) 45%, #e7e1d4 100%);
    transform-origin: 50% 50%; overflow: hidden;
  }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .hud { position: absolute; inset: 0; pointer-events: none; }
  .hud > * { pointer-events: auto; }

  header {
    position: absolute; left: 64px; top: 56px;
  }
  header h1 {
    margin: 0; font-size: 30px; font-weight: 650; letter-spacing: -.01em;
  }
  header p {
    margin: 6px 0 0; font-size: 15px; color: var(--muted); letter-spacing: .02em;
  }
  header .rule { width: 44px; height: 3px; background: var(--accent); margin-top: 14px; }
  header button {
    -webkit-appearance: none; appearance: none; border: 1px solid var(--line);
    background: #fdfbf6; color: var(--ink-2); border-radius: 999px;
    padding: 5px 12px; margin-top: 14px; font-size: 12.5px; cursor: pointer;
    letter-spacing: .02em;
  }
  header button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink-2); }

  /* 右上：真实读数。全部由 spec.js 推导，不手写 */
  .readout {
    position: absolute; right: 64px; top: 56px; width: 236px;
    border-top: 2px solid var(--ink); padding-top: 12px;
  }
  .readout h2 {
    margin: 0 0 10px; font-size: 12px; font-weight: 700; letter-spacing: .16em;
    text-transform: uppercase; color: var(--muted);
  }
  .readout dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 7px 10px; }
  .readout dt { font-size: 14px; color: var(--ink-2); white-space: nowrap; }
  .readout dd { margin: 0; font-size: 14px; font-variant-numeric: tabular-nums; text-align: right; }
  .readout dd b { font-weight: 650; }

  /* 底部：三段式 + 拆解程度 */
  .controls {
    position: absolute; left: 64px; right: 64px; bottom: 44px;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 40px;
  }
  .modes { display: flex; gap: 10px; }
  .modes button {
    -webkit-appearance: none; appearance: none; border: 1px solid var(--line);
    background: #fdfbf6; color: var(--ink); border-radius: 999px;
    padding: 11px 20px 11px 14px; font-size: 15px; cursor: pointer;
    display: flex; align-items: center; gap: 9px;
    transition: border-color .16s cubic-bezier(.65,0,.35,1), background .16s, color .16s;
  }
  .modes button i {
    font-style: normal; font-size: 11px; font-weight: 700; letter-spacing: .06em;
    color: var(--muted);
  }
  .modes button:hover { border-color: var(--ink-2); }
  .modes button[aria-pressed="true"] {
    background: var(--ink); border-color: var(--ink); color: #fdfbf6;
  }
  .modes button[aria-pressed="true"] i { color: #b9b3a4; }

  .scrub { width: 420px; }
  .scrub .label {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
    margin-bottom: 9px;
  }
  .scrub .label b { color: var(--ink); font-size: 13px; letter-spacing: 0; text-transform: none; }
  input[type="range"] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 22px;
    background: transparent; min-width: 0; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 3px; background: var(--line); border-radius: 2px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6.5px;
    border-radius: 50%; background: var(--ink); border: 2px solid #fdfbf6;
    box-shadow: 0 1px 4px rgba(0,0,0,.25);
  }

  /* 阶段说明：左下，与标题同一条竖线 */
  .caption {
    position: absolute; left: 64px; bottom: 146px; width: 560px;
    font-size: 17px; line-height: 1.55; color: var(--ink-2);
    transition: opacity .2s cubic-bezier(.65,0,.35,1);
  }
  .caption b { color: var(--ink); font-weight: 650; }
  .caption::before {
    content: ""; position: absolute; left: -18px; top: 8px; bottom: 8px;
    width: 2px; background: var(--accent);
  }

  /* 标注：引线 + 文字。文字绝不压在零件上 —— 端点取零件中心的 1.9 倍方向。 */
  .callouts { position: absolute; inset: 0; pointer-events: none; }
  .callouts svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .callouts line { stroke: var(--accent); stroke-width: 1.4; }
  .callouts circle { fill: var(--accent); }
  .tag {
    position: absolute; transform: translate(-50%, -50%);
    background: #fdfbf6; border: 1px solid var(--line); border-radius: 4px;
    padding: 8px 12px; max-width: 300px;
    box-shadow: 0 6px 18px -10px rgba(26,26,24,.5);
  }
  .tag b { display: block; font-size: 17px; font-weight: 650; }
  .tag span { display: block; margin-top: 3px; font-size: 13px; color: var(--muted); line-height: 1.45; }

  .hint {
    position: absolute; right: 64px; bottom: 146px; font-size: 12.5px; color: var(--muted);
    text-align: right; line-height: 1.7; letter-spacing: .02em;
  }
  .hint kbd {
    font: inherit; font-size: 11.5px; padding: 1px 5px; border: 1px solid var(--line);
    border-radius: 3px; background: #fdfbf6; color: var(--ink-2);
  }

  /* 阶段进度点：六个点，当前阶段是强调色 */
  .steps { position: absolute; left: 64px; bottom: 108px; display: flex; gap: 7px; }
  .steps i {
    width: 26px; height: 3px; background: var(--line); border-radius: 2px;
    transition: background .2s cubic-bezier(.65,0,.35,1);
  }
  .steps i.on { background: var(--ink); }
  .steps i.now { background: var(--accent); }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div id="frame">
  <canvas id="c"></canvas>

  <div class="hud">
    <header>
      <h1>履带机器人 · 拆解台</h1>
      <p>B-01 · 整机 780 mm · 1 单位 = 200 mm</p>
      <div class="rule"></div>
      <button id="narration" aria-pressed="true">旁白：开</button>
    </header>

    <aside class="readout">
      <h2>实测</h2>
      <dl id="readout"></dl>
    </aside>

    <div class="callouts" id="callouts">
      <svg id="leaders"></svg>
    </div>

    <div class="caption" id="caption"></div>
    <div class="steps" id="steps"></div>

    <div class="controls">
      <div class="modes" id="modes">
        <button data-mode="whole" aria-pressed="true"><i>01</i>整机</button>
        <button data-mode="steps" aria-pressed="false"><i>02</i>依次拆解</button>
        <button data-mode="explode" aria-pressed="false"><i>03</i>全部零件</button>
        <button data-mode="assemble" aria-pressed="false"><i>04</i>部署</button>
      </div>
      <div class="scrub">
        <div class="label"><span>拆解程度</span><b id="pct">0%</b></div>
        <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="拆解程度" />
      </div>
    </div>

    <div class="hint">
      拖动旋转 · 滚轮缩放 · 点击零件看标注<br />
      <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd> 切换 · <kbd>空格</kbd> 播放
    </div>
  </div>
</div>
<script type="module" src="./live.js"></script>
</body>
</html>
