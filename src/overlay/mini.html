<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>baoanlight — 状态</title>
<style>
  :root {
    --red: #ff3b30; --amber: #ffcc00; --green: #34c759; --purple: #b06bff;
    --white: #dfe5ec; --grey: #ccd3dc; --dark: #4a5058;
    --bg: #101216; --card: #1a1d22; --line: rgba(255,255,255,.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: #e9edf2; font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; }
  body { min-height: 100vh; padding: 16px 14px calc(16px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }

  header { display: flex; align-items: center; gap: 10px; padding: 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); margin-bottom: 12px; }
  header .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
  header h1 { font-size: 17px; font-weight: 650; }
  header .meta { margin-left: auto; font-size: 11px; opacity: .5; white-space: nowrap; }

  main { display: flex; flex-direction: column; gap: 8px; }
  .agent { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 13px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
  .agent .dot { width: 11px; height: 11px; border-radius: 50%; align-self: center; }
  .agent .who { min-width: 0; }
  .agent .who b { display: block; font-size: 14px; font-weight: 600; }
  .agent .who span { display: block; font-size: 12px; opacity: .6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent .right { text-align: right; white-space: nowrap; }
  .agent .right .state { font-size: 12.5px; font-weight: 600; }
  .agent .right .fuel { display: block; font-size: 11px; opacity: .55; }

  .agent.hot { border-color: rgba(255,59,48,.45); box-shadow: 0 0 0 1px rgba(255,59,48,.25); }
  .agent.warm { border-color: rgba(255,204,0,.4); }

  footer { margin-top: 14px; text-align: center; font-size: 11px; opacity: .4; }
  footer a { color: inherit; }
  .empty { text-align: center; padding: 40px 0; opacity: .5; }
</style>
</head>
<body>
  <header>
    <span class="dot" id="overall-dot"></span>
    <h1 id="overall-label">未连接</h1>
    <span class="meta" id="meta"></span>
  </header>
  <main id="list"></main>
  <footer>baoanlight · 只读状态 · <span id="updated">—</span> 更新</footer>

<script>
const STATE = {
  error:  { label: '出错了', color: 'var(--red)' },
  waiting:{ label: '需要你', color: 'var(--amber)' },
  busy:   { label: '运行中', color: 'var(--green)' },
  done:   { label: '完成了', color: 'var(--purple)' },
  idle:   { label: '就绪',   color: 'var(--white)' },
  unknown:{ label: '未知',   color: 'var(--grey)' },
  offline:{ label: '未运行', color: 'var(--dark)' },
};
const VERB = { busy: '运行中', waiting: '需要你', error: '出错了', done: '完成了', idle: '就绪', unknown: '未知', offline: '未运行' };

function fmtDur(ms) {
  const min = Math.round(ms / 60000);
  if (min < 1) return '<1 分钟';
  if (min < 60) return `${min} 分钟`;
  return `${Math.floor(min / 60)} 时 ${min % 60} 分`;
}

function render(snap) {
  const s = STATE[snap.overall] || STATE.offline;
  document.getElementById('overall-dot').style.background = s.color;
  document.getElementById('overall-label').textContent = s.label;
  const now = Date.now();

  const list = document.getElementById('list');
  list.innerHTML = '';
  const sessions = (snap.sessions || []).filter((x) => x.state !== 'offline');
  if (!sessions.length) {
    list.innerHTML = '<div class="empty">现在没有软件在运行</div>';
  }
  for (const x of sessions) {
    const st = STATE[x.state] || STATE.unknown;
    const el = document.createElement('div');
    el.className = 'agent' + (x.state === 'error' ? ' hot' : x.state === 'waiting' ? ' warm' : '');
    const runMin = x.state === 'busy' && x.since ? fmtDur(now - x.since) : '';
    const detail = x.state === 'busy' && runMin ? `已运行 ${runMin}` : (x.detail || VERB[x.state]);
    const fuel = (x.fuel && typeof x.fuel.remaining === 'number') ? `额度 ${Math.round(x.fuel.remaining)}%` : '';
    el.innerHTML =
      `<span class="dot" style="background:${st.color}"></span>` +
      `<div class="who"><b>${escapeHtml(x.agent)}</b><span>${escapeHtml(detail)}</span></div>` +
      `<div class="right"><span class="state" style="color:${st.color}">${st.label}</span>` +
      (fuel ? `<span class="fuel">${fuel}</span>` : '') + `</div>`;
    list.appendChild(el);
  }

  document.getElementById('updated').textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  document.getElementById('meta').textContent = sessions.length + ' 个会话';
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function refresh() {
  try {
    const r = await fetch('/state');
    if (r.ok) render(await r.json());
  } catch { /* 网络抖动就等下一轮 */ }
}
refresh();
setInterval(refresh, 4000);
</script>
</body>
</html>
